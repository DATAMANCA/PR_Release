# Keywords to match against release titles/summaries (case-insensitive substring match).
# Grouped by the ETF/theme they were derived from - edit freely, groups are just for
# your own organization and don't affect matching (all terms are pooled together).
#
# These are deliberately specific company names/tickers, not generic category words
# (e.g. "software", "biotech"). Generic words matched too much unrelated noise in
# testing - a press release about an insurance app matched "software" even though it
# had nothing to do with the software sector. Company names are what actually appear
# in press release text.

watchlist:
  DRAM_memory:
