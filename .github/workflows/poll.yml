name: Newswire Poll

on:
  schedule:
    # Offset 2 min past the round 5-min marks (2,7,12,...,57) - GitHub's own docs
    # warn that schedules landing exactly on :00/:05/:10 etc face the most
    # delay/drop risk since every repo's cron tends to pile up there.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: newswire-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SENT: ${{ secrets.SENT }}
          TO: ${{ secrets.TO }}
        run: python src/main.py

      - name: Commit updated state
        run: |
          git config user.name "newswire-watch-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update seen state [skip ci]"
          if git push; then
            exit 0
          fi
          # Push rejected (e.g. main moved since this run's checkout - happens on
          # a manual "Re-run", which reuses the original stale commit). Rebase our
          # state update onto the current tip and retry once. state/seen.json is a
          # machine-owned, append-only dedup list, so replaying our local write on
          # top of the latest remote version is always safe here.
          echo "Push rejected, rebasing onto latest main and retrying..."
          git fetch origin main
          git reset --soft origin/main
          git add state/seen.json
          git commit -m "chore: update seen state [skip ci]"
          git push
